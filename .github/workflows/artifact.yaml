name: artifact
on: push
env:
  FORCE_COLOR: "1"
  ORJSON_BUILD_FREETHREADED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUST_TOOLCHAIN: "nightly-2026-10-01"
  RUST_TOOLCHAIN_STABLE: "1.95"
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UNSAFE_PYO3_BUILD_FREE_THREADED: "1"
  UNSAFE_PYO3_SKIP_VERSION_CHECK: "1"
  UV_LINK_MODE: "copy"
jobs:

  sdist:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:

    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: rustup stable
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain "${RUST_TOOLCHAIN_STABLE}" -y
        rustup default "${RUST_TOOLCHAIN_STABLE}"

    - uses: actions/checkout@v7

    - name: Cargo.toml and pyproject.toml version must match
      run: ./script/check-version

    - run: python3 -m pip install --user --upgrade pip maturin

    - name: Vendor dependencies
      run: |
        maturin build
        cargo fetch
        mkdir .cargo
        cp ci/sdist.toml .cargo/config.toml
        cargo vendor include/cargo --versioned-dirs

    - run: maturin sdist --out=dist

    - run: python3 -m pip install --user dist/orjson*.tar.gz
      env:
        CARGO_NET_OFFLINE: "true"

    - run: python3 -m pip install --user -r test/requirements.txt -r integration/requirements.txt mypy

    - run: pytest -vv test
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run thread
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run http
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run init
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run typestubs
      env:
        PYTHONMALLOC: "debug"

    - name: Store sdist
      uses: actions/upload-artifact@v7
      with:
        name: orjson_sdist
        path: dist
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  manylinux_fedora:
    name: "manylinux_${{ matrix.arch.arch }}_${{ matrix.python.interpreter }}_${{ matrix.python.compatibility }}"
    runs-on: "${{ matrix.arch.runner }}"
    container:
      image: fedora:rawhide
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { interpreter: 'python3.15', compatibility: "manylinux_2_39", publish: true },
          { interpreter: 'python3.15t', compatibility: "manylinux_2_39", publish: false },
          { interpreter: 'python3.14', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.13', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.12', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.11', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.10', compatibility: "manylinux_2_17", publish: true },
        ]
        arch:
          - arch: "x86_64"
            runner: "ubuntu-26.04"
            features: "avx512,nightly"
          - arch: "aarch64"
            runner: "ubuntu-26.04-arm"
            features: "generic_simd,nightly"
    env:
      CARGO_TARGET_DIR: "/tmp/orjson"
      CC: "clang"
      CFLAGS: "-O2 -fstrict-aliasing -fno-plt -emit-llvm"
      LDFLAGS: "-fuse-ld=lld -Wl,-plugin-opt=also-emit-llvm -Wl,--as-needed -Wl,-zrelro,-znow"
      PATH: "/__w/orjson/orjson/.venv/bin:/github/home/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      RUSTFLAGS: "-Z unstable-options -C panic=immediate-abort -C linker=clang -C link-arg=-fuse-ld=lld -C linker-plugin-lto -C link-arg=-Wl,-zrelro,-znow -Z mir-opt-level=4 -D warnings"
      VENV: ".venv"
    steps:

      - name: CPU info
        run: cat /proc/cpuinfo

      - run: dnf install --setopt=install_weak_deps=false -y git-core

      - uses: actions/checkout@v7

      - name: Build and test
        uses: ./.github/actions/manylinux
        with:
          arch: "${{ matrix.arch.arch }}"
          interpreter: "${{ matrix.python.interpreter }}"
          features: "${{ matrix.arch.features }}"
          compatibility: "${{ matrix.python.compatibility }}"
          packages: ""

      - run: pytest -vv test
        env:
          PYTHONMALLOC: "debug"

      - run: ./integration/run thread
        env:
          PYTHONMALLOC: "debug"

      - run: ./integration/run http
        env:
          PYTHONMALLOC: "debug"

      - run: ./integration/run init
        env:
          PYTHON_LAZY_IMPORTS: "all"
          PYTHONMALLOC: "debug"

      - name: Store wheels
        if: matrix.python.publish == true
        uses: actions/upload-artifact@v7
        with:
          name: "orjson_manylinux_${{ matrix.arch.arch }}_${{ matrix.python.interpreter }}_${{ matrix.python.compatibility }}"
          path: dist
          overwrite: true
          retention-days: 1

      - name: Debug
        env:
          CARGO_TARGET_DIR: "/tmp/orjson"
          PYTHON: "${{ matrix.python.interpreter }}"
          TARGET: "${{ matrix.arch.arch }}-unknown-linux-gnu"
        run: |
          export PATH="$PWD/.venv:$HOME/.cargo/bin:$PATH"
          source .venv/bin/activate
          script/debug

  manylinux_pypa:
    name: "manylinux_${{ matrix.platform.arch }}_${{ matrix.python.interpreter }}_${{ matrix.python.compatibility }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { interpreter: 'python3.15', compatibility: "manylinux_2_39", publish: true },
          { interpreter: 'python3.14', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.13', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.12', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.11', compatibility: "manylinux_2_17", publish: true },
          { interpreter: 'python3.10', compatibility: "manylinux_2_17", publish: true },
        ]
        platform:
          - arch: "i686"
            cflags: "-Os -fstrict-aliasing"
            features: "nightly"
            image: "quay.io/pypa/manylinux_2_34_i686:latest"
            runner: "ubuntu-26.04"
            rustflags: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
            tag: "i686"
            target: "i686-unknown-linux-gnu"
          - arch: "armv7"
            cflags: "-Os -fstrict-aliasing"
            features: "nightly"
            image: "quay.io/pypa/manylinux_2_35_armv7l:latest"
            runner: "ubuntu-26.04-arm"
            rustflags: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings -C opt-level=s"
            tag: "armv7l"
            target: "armv7-unknown-linux-gnueabihf"
    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      shell: bash
      run: |
        podman run -t \
          --log-driver=none \
          -v $(pwd):/workspace \
          --workdir /workspace \
          -e CFLAGS="${{ matrix.platform.cflags }}" \
          -e LDFLAGS="-Wl,--as-needed" \
          -e PYTHON="${{ matrix.python.interpreter }}" \
          -e RUST_TOOLCHAIN="${{ env.RUST_TOOLCHAIN }}" \
          -e ORJSON_COMPATIBILITY="${{ matrix.python.compatibility }}" \
          -e ORJSON_TAG="${{ matrix.python.compatibility }}_${{ matrix.platform.tag }}" \
          -e ORJSON_FEATURES="${{ matrix.platform.features }}" \
          -e RUSTFLAGS="${{ matrix.platform.rustflags }}" \
          -e TARGET="${{ matrix.platform.target }}" \
          --pull=newer \
          "${{ matrix.platform.image }}" \
          bash -c "ci/manylinux.sh"

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: "orjson_manylinux_${{ matrix.platform.arch }}_${{ matrix.python.interpreter }}"
        path: target/wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  musllinux:
    name: "muslinux_${{ matrix.platform.arch }}_${{ matrix.python.interpreter }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { interpreter: 'python3.15', publish: true },
          { interpreter: 'python3.14', publish: true },
          { interpreter: 'python3.13', publish: true },
          { interpreter: 'python3.12', publish: true },
          { interpreter: 'python3.11', publish: true },
          { interpreter: 'python3.10', publish: true },
        ]
        platform:
          - arch: "x86_64"
            cflags: "-O2 -fstrict-aliasing"
            features: "avx512,nightly,unwind"
            image: "quay.io/pypa/musllinux_1_2_x86_64:latest"
            platform: "linux/amd64"
            runner: "ubuntu-26.04"
            rustflags: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
            tag: "musllinux_1_2_x86_64"
            target: "x86_64-unknown-linux-musl"
          - arch: "aarch64"
            cflags: "-O2 -fstrict-aliasing"
            features: "generic_simd,nightly,unwind"
            image: "quay.io/pypa/musllinux_1_2_aarch64:latest"
            platform: "linux/arm64"
            runner: "ubuntu-26.04-arm"
            rustflags: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
            tag: "musllinux_1_2_aarch64"
            target: "aarch64-unknown-linux-musl"
    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      shell: bash
      run: |
        podman run -t \
          --log-driver=none \
          -v $(pwd):/workspace \
          --workdir /workspace \
          -e CFLAGS="${{ matrix.platform.cflags }}" \
          -e LDFLAGS="-Wl,--as-needed" \
          -e PYTHON="${{ matrix.python.interpreter }}" \
          -e RUST_TOOLCHAIN="${{ env.RUST_TOOLCHAIN }}" \
          -e ORJSON_COMPATIBILITY="musllinux_1_2" \
          -e ORJSON_TAG="${{ matrix.platform.tag }}" \
          -e ORJSON_FEATURES="${{ matrix.platform.features }}" \
          -e RUSTFLAGS="${{ matrix.platform.rustflags }}" \
          -e TARGET="${{ matrix.platform.target }}" \
          --pull=newer \
          "${{ matrix.platform.image }}" \
          bash -c "ci/manylinux.sh"

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: "orjson_musllinux_${{ matrix.platform.arch }}_${{ matrix.python.interpreter }}"
        path: target/wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  macos_aarch64:
    name: "macos_aarch64_python${{ matrix.python.version }}"
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.15', publish: true },
          { version: '3.14', publish: true },
          { version: '3.13', publish: true },
          { version: '3.12', publish: true },
          { version: '3.11', publish: true },
        ]
    steps:

    - name: CPU info
      run: sysctl -a | grep brand

    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        allow-prereleases: true
        python-version: "${{ matrix.python.version }}"

    - name: Build and test
      shell: bash
      env:
        CC: "clang"
        CFLAGS: "-O2 -fstrict-aliasing -fno-plt -mcpu=apple-m1 -mtune=generic"
        LDFLAGS: "-Wl,--as-needed"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ORJSON_FEATURES: "generic_simd,nightly"
        PATH: "/Users/runner/work/orjson/orjson/.venv/bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin"
        PYTHON: "python${{ matrix.python.version }}"
        RUST_TOOLCHAIN: "${{ env.RUST_TOOLCHAIN }}"
        RUSTFLAGS: "-Z unstable-options -C target-cpu=apple-m1 -Z tune-cpu=generic -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
        TARGET: "aarch64-apple-darwin"
      run: ci/macos.sh

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: orjson_macos_aarch64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  macos_universal2_aarch64:
    name: "macos_universal2_python${{ matrix.python.version }}"
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.15', macosx_target: "10.15", publish: true },
          { version: '3.14', macosx_target: "10.15", publish: true },
          { version: '3.13', macosx_target: "10.15", publish: true },
          { version: '3.12', macosx_target: "10.15", publish: true },
          { version: '3.11', macosx_target: "10.15", publish: true },
          { version: '3.10', macosx_target: "10.15", publish: true },
        ]
    env:
      CC: "clang"
      CFLAGS: "-O2 -fstrict-aliasing"
      LDFLAGS: "-Wl,--as-needed"
      CFLAGS_x86_64_apple_darwin: "-O2 -fstrict-aliasing -fno-plt -march=x86-64-v2 -mtune=generic"
      CFLAGS_aarch64_apple_darwin: "-O2 -fstrict-aliasing -fno-plt -mcpu=apple-m1 -mtune=generic"
      RUSTFLAGS: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
      PATH: "/Users/runner/work/orjson/orjson/.venv/bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    steps:

    - name: CPU info
      run: sysctl -a | grep brand

    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        allow-prereleases: true
        python-version: "${{ matrix.python.version }}"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "${{ env.RUST_TOOLCHAIN }}"
        targets: "aarch64-apple-darwin, x86_64-apple-darwin"
        components: "rust-src"

    - name: Build environment
      run: |
        cargo fetch --target aarch64-apple-darwin &

        export PATH=$HOME/.cargo/bin:$HOME/.local/bin:$PATH

        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade maturin -r test/requirements.txt -r integration/requirements.txt

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: maturin
      run: |
        export PATH=$HOME/.cargo/bin:$HOME/.local/bin:$PATH

        MACOSX_DEPLOYMENT_TARGET="${{ matrix.python.macosx_target }}" \
        PYO3_CROSS_LIB_DIR=$(python -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))") \
        maturin build \
          --release \
          --strip \
          --features=generic_simd,nightly \
          --interpreter python${{ matrix.python.version }} \
          --target=universal2-apple-darwin
        uv pip install target/wheels/orjson*.whl

    - run: pytest -vv test
      env:
        PYTHONMALLOC: "debug"

    - run: source .venv/bin/activate && ./integration/run thread
    - run: source .venv/bin/activate && ./integration/run http
    - run: source .venv/bin/activate && ./integration/run init

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: orjson_universal2_aarch64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  windows:
    name: "windows_${{ matrix.platform.arch }}_python${{ matrix.python.version }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.15', publish: true },
          { version: '3.14', publish: true },
          { version: '3.13', publish: true },
          { version: '3.12', publish: true },
          { version: '3.11', publish: true },
        ]
        platform: [
          { arch: "arm64", target: "aarch64-pc-windows-msvc", "runner": "windows-11-vs2026-arm", features: "generic_simd,nightly" },
          { arch: "x64", target: "x86_64-pc-windows-msvc", "runner": "windows-2025-vs2026", features: "avx512,nightly" },
        ]
    env:
      CFLAGS: "-O2"
      LDFLAGS: "-Wl,--as-needed"
      PYO3_USE_RAW_DYLIB: "0"
      RUSTFLAGS: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
    steps:

    - name: CPU info
      shell: pwsh
      run: Get-WmiObject -Class Win32_Processor -ComputerName. | Select-Object -Property Name, NumberOfCores, NumberOfLogicalProcessors

    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        allow-prereleases: true
        python-version: "${{ matrix.python.version }}"
        architecture: "${{ matrix.platform.arch }}"

    # from maturin
    - shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/${{ matrix.platform.target }}/rustup-init.exe" -OutFile rustup-init.exe
        .\rustup-init.exe --default-toolchain "$env:RUST_TOOLCHAIN-${{ matrix.platform.target }}" --profile minimal --component rust-src -y
        "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
        "CARGO_HOME=$env:USERPROFILE\.cargo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

    - name: Build environment
      run: |
        cargo fetch --target "${{ matrix.platform.target }}" &

        python.exe -m pip install --upgrade pip maturin wheel
        python.exe -m pip install -r test\requirements.txt

        mkdir .cargo
        cp ci\config.toml .cargo\config.toml

    - name: maturin
      run: |
        maturin.exe build --release --strip --features="${{ matrix.platform.features }}" --target="${{ matrix.platform.target }}"
        python.exe -m pip install orjson --no-index --find-links target\wheels

    - run: python.exe -m pytest -s -rxX -v test
      env:
        PYTHONMALLOC: "debug"

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: orjson_windows_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: target\wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0

  windows_310:
    name: "windows_${{ matrix.platform.arch }}_python${{ matrix.python.version }}"
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.10', publish: true },
        ]
        platform: [
          { arch: "x64", target: "x86_64-pc-windows-msvc", "runner": "windows-2025-vs2026", features: "avx512,nightly" },
        ]
    env:
      CFLAGS: "-O2"
      LDFLAGS: "-Wl,--as-needed"
      PYO3_USE_RAW_DYLIB: "0"
      RUSTFLAGS: "-Z unstable-options -C panic=immediate-abort -Z mir-opt-level=4 -D warnings"
    steps:

    - name: CPU info
      shell: pwsh
      run: Get-WmiObject -Class Win32_Processor -ComputerName. | Select-Object -Property Name, NumberOfCores, NumberOfLogicalProcessors

    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        allow-prereleases: true
        python-version: "${{ matrix.python.version }}"
        architecture: "${{ matrix.platform.arch }}"

    # from maturin
    - shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/${{ matrix.platform.target }}/rustup-init.exe" -OutFile rustup-init.exe
        .\rustup-init.exe --default-toolchain "$env:RUST_TOOLCHAIN-${{ matrix.platform.target }}" --profile minimal --component rust-src -y
        "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
        "CARGO_HOME=$env:USERPROFILE\.cargo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

    - name: Build environment
      run: |
        cargo fetch --target "${{ matrix.platform.target }}" &

        python.exe -m pip install --upgrade pip maturin wheel
        python.exe -m pip install -r test\requirements.txt

        mkdir .cargo
        cp ci\config.toml .cargo\config.toml

    - name: maturin
      run: |
        maturin.exe build --release --strip --features="${{ matrix.platform.features }}" --target="${{ matrix.platform.target }}"
        python.exe -m pip install orjson --no-index --find-links target\wheels

    - run: python.exe -m pytest -s -rxX -v test
      env:
        PYTHONMALLOC: "debug"

    - name: Store wheels
      if: matrix.python.publish == true
      uses: actions/upload-artifact@v7
      with:
        name: orjson_windows_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: target\wheels
        overwrite: true
        retention-days: 1
        if-no-files-found: "error"
        compression-level: 0
  pypi:
    name: PyPI
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [
      macos_aarch64,
      macos_universal2_aarch64,
      manylinux_fedora,
      manylinux_pypa,
      musllinux,
      sdist,
      windows,
      windows_310,
    ]
    environment:
      name: PyPI
      url: https://pypi.org/p/orjson
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
          pattern: orjson_*

      - run: ls -1 dist/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: ./script/check-pypi dist

      - name: Publish distribution to PyPI
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          packages-dir: dist
          skip-existing: true
          verbose: true
